[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-prediction"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "matplotlib>=3.9,<4", "seaborn>=0.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# The reference implementation keeps several short mathematical expressions
# compact; CI still checks all undefined names and import-time correctness.
select = ["F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
