services:
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    ports: ["8000:8000"]
    environment: {MODEL_ARTIFACT_PATH: /app/artifacts/model.joblib}
    healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"], interval: 10s, timeout: 3s, retries: 5}
  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes: ["./frontend:/app/frontend"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: {api: {condition: service_healthy}}
