[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-risk"
version = "1.0.0"
description = "Auditable loan default probability decision support"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.3", "pandas==2.2.3", "scipy==1.16.3",
  "scikit-learn==1.6.1", "joblib==1.4.2", "matplotlib==3.10.1",
  "fastapi==0.162.0", "starlette==1.3.1", "pydantic==2.11.3",
  "pydantic-settings==2.8.1", "uvicorn==0.34.2", "prometheus-client==0.21.1",
  "threadpoolctl==3.6.0"
]
[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.28.1", "ruff==0.11.5", "mypy==1.15.0", "pip-audit==2.9.0"]
[project.scripts]
loan-risk = "loan_risk.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
[tool.setuptools.package-data]
loan_risk = ["logging.json"]
