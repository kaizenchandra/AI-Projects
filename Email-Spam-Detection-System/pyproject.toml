[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-spam-detection"
version = "0.1.0"
description = "Leakage-aware, interpretable email spam detection with Multinomial Naive Bayes."
requires-python = ">=3.12,<3.16"
dependencies = [
  "fastapi==0.115.6",
  "joblib==1.4.2",
  "numpy==2.2.1",
  "pandas==2.2.3",
  "prometheus-client==0.21.1",
  "pydantic==2.10.5",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "mypy==1.14.1", "pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.2", "types-PyYAML==6.0.12.20241230"]

[project.scripts]
spam-detection = "spam_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
